<svg viewBox="0 0 412 210" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .pill { fill: rgba(110, 86, 207, 0.14); stroke: #8b7ae8; stroke-width: 1; }
    .pill-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #b4a7f5; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .arch { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #c9d1d9; }
    .stat-box { fill: #161b22; stroke: #21262d; stroke-width: 1; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15.5px; font-weight: 700; fill: #b4a7f5; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #8b949e; }
    .logo-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
  </style>
  <rect x="1" y="1" width="410" height="208" rx="14" class="card" />
  <rect x="20" y="16" width="46" height="46" rx="10" class="logo-bg" />
  <image x="24" y="20" width="38" height="38" href="data:image/png;base64," />
  <rect x="78" y="16" width="175" height="21" rx="10.5" class="pill" />
  <text x="89" y="30" class="pill-txt">GO • MCP • GOOGLE APIs</text>
  <text x="78" y="58" class="title">MCP DocsLaTeX Bridge</text>
  <text x="20" y="82" class="desc">Ponte bidirecional entre projetos LaTeX locais e Google</text>
  <text x="20" y="98" class="desc">Docs/Drive com lint NBR 14724/6023/6024/6027 e MD5 sync.</text>
  <rect x="20" y="110" width="372" height="24" rx="5" class="stat-box" />
  <text x="30" y="126" class="arch">Diff 3 níveis • Anti-bleeding UTF-16 • Tabelas IBGE • Goroutines</text>
  <rect x="20" y="144" width="180" height="48" rx="8" class="stat-box" />
  <text x="32" y="165" class="stat-val">20 Tools HATEOAS</text>
  <text x="32" y="181" class="stat-lbl">Binário nativo zero-deps</text>
  <rect x="212" y="144" width="180" height="48" rx="8" class="stat-box" />
  <text x="224" y="165" class="stat-val">4 Normas ABNT</text>
  <text x="224" y="181" class="stat-lbl">Sumário com página real PDF</text>
</svg>