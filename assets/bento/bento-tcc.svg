<svg viewBox="0 0 320 195" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .pill { fill: rgba(16, 185, 129, 0.14); stroke: #34d399; stroke-width: 1; }
    .pill-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #34d399; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .stat-box { fill: #161b22; stroke: #21262d; stroke-width: 1; }
    .arch { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #c9d1d9; }
    .gain { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #34d399; }
    .logo-bg { fill: #f6f8fa; stroke: #30363d; stroke-width: 1; }
  </style>
  <rect x="1" y="1" width="318" height="193" rx="14" class="card" />
  <rect x="18" y="16" width="44" height="44" rx="10" class="logo-bg" />
  <image x="22" y="20" width="36" height="36" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64," />
  <rect x="72" y="16" width="182" height="20" rx="10" class="pill" />
  <text x="82" y="30" class="pill-txt">LATEX • DOCKER • ACTIONS</text>
  <text x="72" y="55" class="title">Template TCC LaTeX</text>
  <text x="18" y="80" class="desc">Ambiente ABNT automatizado para TCCs</text>
  <text x="18" y="97" class="desc">com Skills nativas e ponte Google Docs.</text>
  <rect x="18" y="110" width="284" height="38" rx="6" class="stat-box" />
  <text x="28" y="126" class="arch">• CI/CD Pages + Releases automáticos</text>
  <text x="28" y="141" class="arch">• Dev Containers + Mermaid + .agents/skills</text>
  <text x="18" y="174" class="gain">Compilação zero-setup + MCP nativo</text>
</svg>