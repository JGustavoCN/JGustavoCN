<svg viewBox="0 0 320 195" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .pill { fill: rgba(237, 139, 0, 0.12); stroke: #ed8b00; stroke-width: 1; }
    .pill-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #f7b731; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #f0f6fc; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .stat-box { fill: #161b22; stroke: #21262d; stroke-width: 1; }
    .arch { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #c9d1d9; }
    .gain { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #f7b731; }
    .logo-bg { fill: #f6f8fa; stroke: #30363d; stroke-width: 1; }
  </style>
  <rect x="1" y="1" width="318" height="193" rx="14" class="card" />
  <rect x="18" y="16" width="92" height="36" rx="8" class="logo-bg" />
  <image x="22" y="19" width="84" height="30" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64," />
  <rect x="120" y="16" width="152" height="20" rx="10" class="pill" />
  <text x="130" y="30" class="pill-txt">JAVA 21 • JASPER 7</text>
  <text x="18" y="72" class="title">PharmaStation PDV</text>
  <text x="18" y="92" class="desc">Gestão farmacêutica e PDV construindo</text>
  <text x="18" y="108" class="desc">estruturas de dados em memória do zero.</text>
  <rect x="18" y="118" width="284" height="38" rx="6" class="stat-box" />
  <text x="28" y="134" class="arch">• Lista&lt;E&gt;, Fila&lt;E&gt;, Pilha&lt;E&gt; próprias</text>
  <text x="28" y="149" class="arch">• FlatLaf Dark/Light • RBAC SHA-256 + PDF</text>
  <text x="18" y="178" class="gain">Rigor algorítmico + UX Desktop</text>
</svg>